# Render Blueprint — one-click-ish deploy of the Rhodium app + a free Postgres.
# Persistent web service (keeps the background job + mock chain state working).
services:
  - type: web
    name: rhodium
    runtime: node
    plan: free
    # NODE_ENV=production is set during build, so force dev deps (tsc, vite) with
    # --include=dev on BOTH installs, else the builds can't find their tools.
    # --workspaces=false: this service is the API only; the landing site and
    # chain workspaces are deployed separately.
    buildCommand: >-
      npm install --include=dev --workspaces=false &&
      npm run prisma:generate &&
      npm --prefix dashboard install --include=dev &&
      npm --prefix dashboard run build &&
      npm run build:prod
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rhodium-db
          property: connectionString
      # --- set these in the Render dashboard (sensitive) ---
      - key: FIELD_ENCRYPTION_KEY   # 64 hex chars: openssl rand -hex 32
        sync: false
      - key: APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN  # your 60-day token
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      # --- Embedded Signup (vendors on their own number) ---
      - key: WHATSAPP_APP_ID
        value: "1534245258196461"
      - key: WHATSAPP_CONFIG_ID
        value: "2976386586040947"
      # --- Monnify bank rail (sensitive) ---
      - key: MONNIFY_API_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      - key: MONNIFY_CONTRACT_CODE
        sync: false
      - key: MONNIFY_WALLET_ACCOUNT_NUMBER
        sync: false
      # --- non-secret config ---
      - key: WHATSAPP_MODE
        value: live
      - key: WHATSAPP_VERIFY_TOKEN
        value: rhodium-verify
      - key: WHATSAPP_WA_NUMBER   # bot's wa.me digits, for buyer shop links
        # Real Fonio Labs number (+234 803 680 3974). Was the Meta test number
        # 15551405536, which is no longer attached to the WABA — buyer shop
        # links pointing at it go nowhere.
        value: "2348036803974"
      - key: MONNIFY_BASE_URL
        value: https://sandbox.monnify.com
      - key: FIAT_ADAPTER_MODE
        value: live
      - key: FEATURE_QUAI_ENABLED
        value: "true"
      # live = the checkout page opens a real wallet and /api/crypto/confirm
      # verifies the tx against Orchard. In mock the page says "no on-chain tx
      # yet" and orders settle without ever touching the chain — which silently
      # made every crypto sale fake while the bank rail was already live.
      # Needs QUAI_CONTRACT_ADDRESS set in the dashboard (it is).
      - key: QUAI_ADAPTER_MODE
        value: live
      - key: QUAI_PAYMENT_ASSET
        value: native
      # Buyer-facing origin — what a customer sees on a checkout link.
      - key: PUBLIC_BASE_URL
        value: https://pay.userhodium.xyz
      # Merchant-facing origin — dashboard, wallet backup, OAuth callback.
      # Both hostnames reach THIS service; they differ only in what a reader
      # sees. WHATSAPP_OAUTH_REDIRECT_URI derives from this, so it must match
      # the Meta app's registered redirect URI character for character.
      - key: MERCHANT_BASE_URL
        value: https://app.userhodium.xyz

databases:
  - name: rhodium-db
    plan: free
    databaseName: rhodium
    user: rhodium
