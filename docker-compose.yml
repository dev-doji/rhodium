services:
  postgres:
    image: postgres:16-alpine
    container_name: rhodium-postgres
    environment:
      POSTGRES_USER: rhodium
      POSTGRES_PASSWORD: rhodium
      POSTGRES_DB: rhodium
    ports:
      - "5439:5432"
    volumes:
      - rhodium_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhodium"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rhodium_pg:
