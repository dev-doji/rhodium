<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Receipt · Rhodium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    /* Same tokens as checkout — a buyer moves from one to the other, and a
       receipt that looks like a different product undermines the sale. */
    :root {
      color-scheme: light dark;
      --bg:#faf9f7; --surface:#ffffff; --line:#e6e2dc;
      --ink:#16130f; --ink-2:#5c554c; --ink-3:#8b8378;
      --accent:#0f5132; --good-bg:#eaf5ee; --good-line:#bcdcc8; --good-ink:#0f5132;
      --radius:14px; --shadow:0 1px 2px rgba(22,19,15,.05), 0 12px 32px -12px rgba(22,19,15,.14);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12110f; --surface:#1b1917; --line:#302c28;
              --ink:#f5f2ee; --ink-2:#b3aca3; --ink-3:#847d74;
              --accent:#4ade80; --good-bg:#132a1d; --good-line:#225034; --good-ink:#7ee6a6;
              --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px -16px rgba(0,0,0,.6); }
    }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px 20px; min-height:100dvh; display:flex;
           align-items:center; justify-content:center;
           font-family:"IBM Plex Sans",system-ui,sans-serif;
           background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
    .card { width:100%; max-width:400px; background:var(--surface);
            border:1px solid var(--line); border-radius:var(--radius);
            padding:28px 24px 22px; box-shadow:var(--shadow); }
    .brand { display:flex; align-items:center; gap:7px; font-size:11px; letter-spacing:.14em;
             text-transform:uppercase; font-weight:600; color:var(--ink-3); }
    .brand svg { width:14px; height:14px; }
    .paidwrap { display:flex; align-items:center; gap:10px; margin-top:20px; }
    .tick { width:38px; height:38px; border-radius:50%; background:var(--good-bg);
            border:1px solid var(--good-line); display:flex; align-items:center;
            justify-content:center; flex:none; }
    .tick svg { width:20px; height:20px; color:var(--good-ink); }
    .paidwrap h1 { font-size:17px; font-weight:600; margin:0; letter-spacing:-.01em; }
    .paidwrap p { margin:2px 0 0; font-size:12.5px; color:var(--ink-3); }
    .total { font-size:34px; font-weight:600; letter-spacing:-.02em; margin:20px 0 0;
             font-variant-numeric:tabular-nums; }
    .items { margin-top:20px; border-top:1px solid var(--line); }
    .item { display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--line);
            font-size:13.5px; }
    .item .n { flex:1; color:var(--ink); }
    .item .q { color:var(--ink-3); font-variant-numeric:tabular-nums; }
    .item .p { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
    .meta { margin-top:18px; }
    .mrow { display:flex; padding:9px 0; font-size:12.5px; color:var(--ink-2);
            border-bottom:1px solid var(--line); }
    .mrow:last-child { border-bottom:0; }
    .mrow span { flex:1; }
    .mrow b { color:var(--ink); font-weight:600;
              font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; }
    .foot { margin-top:20px; text-align:center; font-size:11.5px; color:var(--ink-3); line-height:1.6; }
    .dl { display:flex; gap:10px; margin-top:20px; }
    .dl button { flex:1; padding:11px; border-radius:10px; border:1px solid var(--line);
                 background:transparent; color:var(--ink); font:inherit; font-size:13px;
                 font-weight:600; cursor:pointer; display:inline-flex; align-items:center;
                 justify-content:center; gap:7px; transition:border-color .15s ease; }
    .dl button:hover { border-color:var(--ink-3); }
    .dl button:disabled { opacity:.5; cursor:default; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
    .err { text-align:center; color:var(--ink-2); font-size:14px; padding:30px 0; line-height:1.6; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l3-2 3 2 3-2 3 2 3-2V2l-3 2-3-2-3 2-3-2z"/><path d="M8 9h8M8 13h5"/></svg>
      Receipt
    </div>
    <div id="body"><div class="err">Loading…</div></div>
  </div>
<script>
  const orderId = location.pathname.split("/").pop();
  const $ = (id) => document.getElementById(id);

  const DL = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>';

  const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

  function esc(s) {
    return String(s ?? "").replace(/[&<>"]/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  async function load() {
    let d;
    try {
      const res = await fetch(`/api/receipt/${orderId}`);
      if (!res.ok) throw new Error("unavailable");
      d = await res.json();
    } catch {
      // A receipt exists only for a settled order. Saying so plainly beats a
      // blank screen for someone who opened the link a moment too early.
      $("body").innerHTML =
        '<div class="err">This receipt isn\'t available yet.<br>' +
        'Receipts appear once a payment has settled.</div>';
      return;
    }

    const paid = d.paidAt ? new Date(d.paidAt) : null;
    const when = paid
      ? paid.toLocaleString("en-NG", { dateStyle: "medium", timeStyle: "short" })
      : "";

    const items = (d.items || []).map((i) => `
      <div class="item">
        <span class="n">${esc(i.name)}</span>
        ${i.qty > 1 ? `<span class="q">×${i.qty}</span>` : ""}
        <span class="p">${esc(i.unitPriceFormatted)}</span>
      </div>`).join("");

    $("body").innerHTML = `
      <div class="paidwrap">
        <div class="tick">${TICK}</div>
        <div>
          <h1>Paid to ${esc(d.merchantName)}</h1>
          <p>${esc(when)}</p>
        </div>
      </div>
      <div class="total">${esc(d.amountFormatted)}</div>
      <div class="items">${items}</div>
      <div class="meta">
        <div class="mrow"><span>Order</span><b>${esc(d.orderRef)}</b></div>
        <div class="mrow"><span>Method</span><b>${esc(d.method)}</b></div>
        ${d.buyerMasked ? `<div class="mrow"><span>Paid by</span><b>${esc(d.buyerMasked)}</b></div>` : ""}
      </div>
      <div class="dl">
        <button id="png">${DL} PNG</button>
        <button id="pdf">${DL} PDF</button>
      </div>
      <div class="foot">Keep this link — it is your proof of payment.</div>`;

    // Fetch-then-save rather than a plain link: it keeps the filename we choose
    // and surfaces a failure instead of navigating away to an error page.
    const save = async (btn, path, filename) => {
      const el = $(btn);
      el.disabled = true;
      const original = el.innerHTML;
      el.textContent = "Preparing…";
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error("unavailable");
        const url = URL.createObjectURL(await res.blob());
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      } catch {
        el.textContent = "Couldn't download";
        setTimeout(() => { el.innerHTML = original; }, 2000);
        el.disabled = false;
        return;
      }
      el.innerHTML = original;
      el.disabled = false;
    };
    $("png").onclick = () => save("png", `/api/receipt/${orderId}/image.png`, `receipt-${d.orderRef}.png`);
    $("pdf").onclick = () => save("pdf", `/api/receipt/${orderId}/document.pdf`, `receipt-${d.orderRef}.pdf`);
  }
  load();
</script>
</body>
</html>
