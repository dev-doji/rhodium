<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rhodium — Back up your wallet</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    /* ------------------------------------------------------------------
       Back up your wallet.

       Was a dark page with gradient buttons, 18px radii and system fonts —
       a third visual identity beside the storefront and the dashboard, and
       the page a merchant lands on when she clicks Wallet. Now the same
       light, flat language as everything else: square corners, solid
       borders, Outfit headings on Inter body.
       ------------------------------------------------------------------ */
    :root {
      color-scheme: light;
      --brand:#0033e7; --brand-600:#002bc4; --brand-50:#eef2fe;
      --bg:#f7f8fc; --surface:#ffffff; --surface-2:#f7f8fc;
      --line:#e4e7f2; --ink:#05061a; --ink-2:#4a4f68; --ink-3:#6b7189;
      --warn-bg:#fff6e6; --warn-ink:#7a4b00;
      --bad-bg:#fdeceb; --bad-ink:#8a2019;
      --good-ink:#0f5132;
    }
    * { box-sizing: border-box; }
    body {
      margin:0; background:var(--bg); color:var(--ink);
      font-family:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size:15px; line-height:1.5;
    }
    .bar { border-bottom:1px solid var(--line); background:var(--surface); }
    .bar-in {
      max-width:1120px; margin:0 auto; padding:16px 20px;
      display:flex; align-items:center; gap:16px;
    }
    .mark {
      font-family:"Outfit","Inter",sans-serif; font-weight:800; font-size:19px;
      letter-spacing:-0.03em; text-decoration:none; color:var(--ink);
    }
    .mark span { color:var(--brand); }
    .back {
      margin-left:auto; font-size:14px; font-weight:600; text-decoration:none;
      color:var(--brand-600);
    }
    .back:hover { text-decoration:underline; }
    .wrap { display:flex; justify-content:center; padding:40px 20px 64px; }
    .card {
      width:100%; max-width:460px; background:var(--surface);
      border:1px solid var(--line); border-radius:0; padding:28px;
    }
    h1 {
      font-family:"Outfit","Inter",sans-serif; font-size:23px; font-weight:700;
      letter-spacing:-0.02em; margin:0 0 6px;
    }
    .sub { color:var(--ink-2); font-size:14.5px; margin-bottom:22px; }
    label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
    input {
      width:100%; padding:12px 13px; margin:0 0 16px; font:inherit;
      border:1px solid var(--line); border-radius:0;
      background:var(--surface); color:var(--ink);
    }
    button {
      width:100%; padding:13px; font:inherit; font-weight:600; font-size:15px;
      border:1px solid var(--brand); border-radius:0;
      background:var(--brand); color:#fff; cursor:pointer;
    }
    button:hover { background:var(--brand-600); border-color:var(--brand-600); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    button:focus-visible, input:focus-visible {
      outline:3px solid var(--brand); outline-offset:2px;
    }
    .warn {
      background:var(--warn-bg); border:1px solid var(--warn-ink);
      border-left-width:4px; color:var(--warn-ink);
      padding:12px 14px; border-radius:0; font-size:13.5px; margin:16px 0;
    }
    .secret {
      font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:14px;
      background:var(--surface-2); border:1px solid var(--line);
      border-radius:0; padding:14px; word-break:break-word; margin:8px 0;
      user-select:all; line-height:1.7;
    }
    .lbl {
      font-size:12px; color:var(--ink-3); text-transform:uppercase;
      letter-spacing:.08em; font-weight:600; margin-top:14px;
    }
    .err {
      background:var(--bad-bg); border:1px solid var(--bad-ink);
      border-left-width:4px; color:var(--bad-ink);
      padding:11px 13px; border-radius:0; font-size:14px; margin-top:12px;
    }
    .ok { color:var(--good-ink); font-weight:600; }
  </style>
</head>
<body>
  <!-- Wallet, traction and the storefront are separate pages, not routes in
       the dashboard SPA, so arriving here used to mean the nav simply vanished
       with nothing to click back to. -->
  <header class="bar">
    <div class="bar-in">
      <a class="mark" href="/">Rhodium<span>.</span></a>
      <a class="back" href="/">&larr; Back to dashboard</a>
    </div>
  </header>
  <div class="wrap">
  <div class="card">
    <h1>🔐 Back up your Rhodium wallet</h1>
    <div class="sub">Verify it's you, then save your secret recovery phrase. We show it once — keep it safe and never share it.</div>
    <div id="body"></div>
  </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    let phone = "", token = "";

    function stepPhone() {
      $("body").innerHTML = `
        <label>Your WhatsApp number (the one you onboarded with)</label>
        <input id="phone" placeholder="+2348012345678" />
        <button id="send">Text me a code</button>
        <div id="msg"></div>`;
      $("send").onclick = async () => {
        phone = $("phone").value.trim();
        $("send").disabled = true;
        try {
          const r = await fetch("/auth/otp/request", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ phone }) });
          if (!r.ok) throw new Error("could not send code");
          stepCode();
        } catch(e) { $("msg").innerHTML = `<div class="err">${e.message}</div>`; $("send").disabled = false; }
      };
    }

    function stepCode() {
      $("body").innerHTML = `
        <label>Enter the 6-digit code we sent on WhatsApp</label>
        <input id="code" placeholder="123456" inputmode="numeric" />
        <button id="verify">Verify &amp; reveal</button>
        <div id="msg"></div>`;
      $("verify").onclick = async () => {
        $("verify").disabled = true;
        try {
          const v = await fetch("/auth/otp/verify", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ phone, code: $("code").value.trim() }) });
          if (!v.ok) throw new Error("invalid code");
          token = (await v.json()).token;
          reveal();
        } catch(e) { $("msg").innerHTML = `<div class="err">${e.message}</div>`; $("verify").disabled = false; }
      };
    }

    async function reveal() {
      try {
        const r = await fetch("/api/wallet/reveal", { method:"POST", headers:{ authorization:"Bearer "+token } });
        if (!r.ok) throw new Error("no wallet found for this account");
        const w = await r.json();
        $("body").innerHTML = `
          <div class="warn">⚠️ Anyone with this phrase controls your funds. Write it down offline. Never share it or type it into any other site.</div>
          <div class="lbl">Wallet address</div><div class="secret">${w.address}</div>
          <div class="lbl">Secret recovery phrase (12 words)</div><div class="secret">${w.mnemonic}</div>
          <div class="lbl">Private key</div><div class="secret">${w.privateKey}</div>
          <p class="ok">Saved it? You can import this into BlipPay or Pelagus to control your funds.</p>`;
      } catch(e) { $("body").innerHTML = `<div class="err">${e.message}</div>`; }
    }

    stepPhone();
  </script>
</body>
</html>
