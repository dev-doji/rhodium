<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pay securely · Rhodium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    /* ------------------------------------------------------------------
       A screen where someone is about to move money. The job is confidence,
       not delight: one accent, no gradients, and nothing competing with the
       account number they have to copy correctly.

       Outfit and Inter match the storefront and the marketing site, so the
       buyer stays inside one brand at the exact moment they decide whether to
       trust it with money. IBM Plex Mono stays for the account number alone:
       a misread digit there is a payment that never arrives, and a monospaced
       face designed for data is what keeps 0/O and 1/l apart.
       ------------------------------------------------------------------ */
    :root {
      /* Light only, and the same Rhodium palette the storefront uses. A buyer
         crossing from the shop to the pay screen must not feel handed off to
         a different company — this is the moment they are deciding whether to
         trust us with money. */
      color-scheme: light;
      --brand:#0033e7;   --brand-600:#002bc4;
      --bg:#f7f8fc;      --surface:#ffffff;   --line:#e4e7f2;
      --ink:#05061a;     --ink-2:#4a4f68;     --ink-3:#767c96;
      --accent:#0033e7;  --accent-ink:#ffffff;
      --good-bg:#eaf7ef; --good-line:#bcdcc8; --good-ink:#0f5132;
      --warn-bg:#fdf4e3; --warn-line:#e8d5a8; --warn-ink:#6b4e10;
      --bad-bg:#fdeceb;  --bad-line:#f2c4c0;  --bad-ink:#8a2019;
      /* Flat: square corners, borders instead of elevation. */
      --radius:0px;
      --shadow:none;
    }
    h1,h2,h3 { font-family:"Outfit","Inter",system-ui,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px 20px; min-height:100dvh;
           display:flex; align-items:center; justify-content:center;
           font-family:"Inter",system-ui,-apple-system,sans-serif;
           background:var(--bg); color:var(--ink);
           -webkit-font-smoothing:antialiased; }
    .card { width:100%; max-width:400px; background:var(--surface);
            border:1px solid var(--line); border-radius:var(--radius);
            padding:28px 24px 22px; box-shadow:none; }

    .brand { display:flex; align-items:center; gap:7px; font-size:11px;
             letter-spacing:.14em; text-transform:uppercase; font-weight:600;
             color:var(--ink-3); }
    .brand svg { width:14px; height:14px; }

    h1 { font-size:17px; font-weight:600; margin:18px 0 2px; letter-spacing:-.01em; }
    .order { color:var(--ink-3); font-size:12px; font-variant-numeric:tabular-nums;
             font-family:"IBM Plex Mono",ui-monospace,monospace; }

    /* The amount is the second thing read, after the shop name. */
    .amount { font-size:34px; font-weight:600; letter-spacing:-.02em; margin-top:18px;
              font-variant-numeric:tabular-nums; }
    .crypto { display:flex; align-items:center; gap:6px; color:var(--ink-2);
              font-weight:500; margin-top:5px; font-size:13px; }
    .crypto svg { width:14px; height:14px; color:var(--accent); }

    /* --- the account: the one thing that must be read perfectly --- */
    .acct { margin-top:20px; border:1px solid var(--line); border-radius:0;
            padding:18px 16px 16px; text-align:center; background:var(--bg); }
    .acct-bank { font-size:11px; font-weight:600; color:var(--ink-3);
                 text-transform:uppercase; letter-spacing:.1em; }
    /* Grouped, monospaced, generously tracked — a buyer is copying this into
       a banking app by hand and a transposed digit sends money nowhere. */
    .acct-no { font-family:"IBM Plex Mono",ui-monospace,monospace;
               font-size:29px; font-weight:600; letter-spacing:.06em;
               margin:9px 0 5px; color:var(--ink); font-variant-numeric:tabular-nums;
               user-select:all; }
    .acct-name { font-size:12px; color:var(--ink-2); }
    .copybtn { margin-top:14px; width:100%; padding:12px; border:0; border-radius:0;
               background:var(--accent); color:var(--accent-ink); font:inherit;
               font-size:14px; font-weight:600; cursor:pointer;
               display:inline-flex; align-items:center; justify-content:center; gap:7px;
               transition:opacity .15s ease; }
    .copybtn:hover { opacity:.88; }

    .rows { margin-top:18px; }
    .row { display:flex; align-items:center; gap:10px; padding:11px 0;
           border-top:1px solid var(--line); font-size:13px; color:var(--ink-2); }
    .row:first-child { border-top:0; }
    .row svg { width:16px; height:16px; color:var(--ink-3); flex:none; }
    .row .k { flex:1; }
    .row b { color:var(--ink); font-weight:600; text-align:right;
             font-variant-numeric:tabular-nums; }

    button { width:100%; margin-top:18px; padding:14px; font:inherit; font-size:15px;
             font-weight:600; border:0; border-radius:0; cursor:pointer;
             display:flex; align-items:center; justify-content:center; gap:8px;
             background:var(--accent); color:var(--accent-ink);
             transition:opacity .15s ease; }
    button:hover { opacity:.88; }
    button svg { width:18px; height:18px; }
    button:disabled { opacity:.5; cursor:default; }
    /* Quieter than the primary action: this only asks the bank to look again,
       so it must not compete with the thing the buyer actually needs to do. */
    button.secondary { background:transparent; border:1px solid var(--line);
                       color:var(--ink-2); font-size:13px; padding:11px; margin-top:8px; }
    button.secondary:hover { border-color:var(--ink-3); opacity:1; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:0; }

    .hint { font-size:11.5px; color:var(--ink-3); margin-top:14px; text-align:center;
            line-height:1.6; }
    .waiting { display:flex; align-items:center; justify-content:center; gap:9px;
               font-size:12.5px; color:var(--ink-2); padding:14px 0; text-align:center; }
    .spinner { width:13px; height:13px; border-radius:50%; border:2px solid currentColor;
               border-top-color:transparent; animation:spin .8s linear infinite;
               display:inline-block; flex:none; }
    @keyframes spin { to { transform:rotate(360deg) } }

    .ok { text-align:center; padding:8px 0 4px; }
    .ok .checkwrap { width:52px; height:52px; margin:0 auto 14px; border-radius:50%;
                     background:var(--good-bg); border:1px solid var(--good-line);
                     display:flex; align-items:center; justify-content:center; }
    .ok .checkwrap svg { width:26px; height:26px; color:var(--good-ink); }
    .ok h2 { font-size:19px; font-weight:600; margin:0 0 6px; letter-spacing:-.01em; }
    .badge { display:inline-flex; align-items:center; gap:6px; background:var(--good-bg);
             color:var(--good-ink); border:1px solid var(--good-line); font-size:11.5px;
             font-weight:500; padding:5px 11px; border-radius:0; }
    .badge svg { width:12px; height:12px; }
    .explorer { display:inline-flex; align-items:center; gap:7px; margin-top:16px;
                padding:10px 14px; border-radius:0; background:var(--bg);
                border:1px solid var(--line); color:var(--ink-2); text-decoration:none;
                font-size:12.5px; font-weight:600; }
    .explorer svg { width:14px; height:14px; }
    .txhash { font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px;
              color:var(--ink-3); margin-top:10px; word-break:break-all; }
    .mode { display:inline-flex; align-items:center; gap:6px; font-size:10.5px;
            font-weight:500; padding:4px 10px; border-radius:0; margin-top:14px; }
    .mode.live { background:var(--good-bg); color:var(--good-ink); border:1px solid var(--good-line); }
    .mode.demo { background:var(--warn-bg); color:var(--warn-ink); border:1px solid var(--warn-line); }
    .mode svg { width:11px; height:11px; }
    .err { background:var(--bad-bg); border:1px solid var(--bad-line); color:var(--bad-ink);
           padding:12px 14px; border-radius:0; margin-top:14px; font-size:13px; line-height:1.55; }
    .err a { color:inherit; font-weight:600; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration:.01ms !important; transition-duration:.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      Secure checkout
    </div>
    <h1 id="merchant">Loading…</h1>
    <div class="order" id="orderline"></div>
    <div class="amount" id="amount">—</div>
    <div class="crypto" id="crypto"></div>
    <div id="body"></div>
  </div>

  <script>
    const orderId = location.pathname.split("/").pop();
    const $ = (id) => document.getElementById(id);
    let data, lastTx = null;

    const ICON = {
      globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>',
      shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
      wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h2"/></svg>',
      coin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5a2.5 2 0 0 1 5 0c0 2.5-5 1.5-5 4a2.5 2 0 0 0 5 0"/></svg>',
      check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12l5 5L20 6"/></svg>',
      link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3h7v7M21 3l-9 9M10 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg>',
    };

    function humanCrypto(inst) {
      if (!inst.cryptoAmount) return "?";
      const decimals = inst.tokenSymbol === "QUAI" ? 18 : 6;
      const n = Number(inst.cryptoAmount) / Math.pow(10, decimals);
      return n.toLocaleString(undefined, { maximumFractionDigits: 6 }) + " " + (inst.tokenSymbol || "");
    }

    async function load() {
      try {
        const res = await fetch(`/api/checkout/${orderId}`);
        if (!res.ok) {
          // Report what actually went wrong. This used to say "order not
          // found" for EVERY failure, so a payment provider being down —
          // a 500 — was indistinguishable from a bad link, and sent whoever
          // was debugging it looking for a missing order that existed all
          // along.
          let detail = "";
          try {
            const body = await res.json();
            detail = body.message || body.error || "";
          } catch { /* not JSON; the status is all we have */ }

          if (res.status === 404) {
            throw new Error(
              "We couldn't find this order. The link may be wrong or expired — " +
                "please ask the seller for a new one."
            );
          }
          if (res.status >= 500) {
            throw new Error(
              "We couldn't set up your payment just now. Please refresh in a " +
                "moment, or ask the seller to resend the link." +
                (detail ? ` (${detail})` : "")
            );
          }
          throw new Error(detail || `Something went wrong (${res.status}).`);
        }
        data = await res.json();
        render();
      } catch (e) {
        // A network failure lands here with a useless "Failed to fetch".
        const msg =
          e instanceof TypeError
            ? "We couldn't reach the server. Check your connection and refresh."
            : e.message;
        $("body").innerHTML = `<div class="err">${msg}</div>`;
      }
    }

    function render() {
      const { order, merchantName, instruction } = data;
      $("merchant").textContent = merchantName;
      $("orderline").textContent = `Order ${order.id.slice(-6).toUpperCase()}`;
      $("amount").textContent = order.amountFormatted;

      if (order.status === "paid") { paid(); return; }

      // A bank order carries a reserved account, not a contract. It used to fall
      // through to the crypto branch and render an empty page, so the WhatsApp
      // bot could only ever hand out a link for the QUAI rail.
      if (instruction.instructionType === "dva" || instruction.accountNumber) {
        renderBankTransfer(instruction);
        return;
      }

      $("crypto").innerHTML = `${ICON.coin} ≈ ${humanCrypto(instruction)} on Quai`;

      const contract = (instruction.contractAddress || "").replace(/^(.{6}).+(.{4})$/, "$1…$2");
      $("body").innerHTML = `
        <div class="rows">
          <div class="row">${ICON.globe}<span class="k">Rate</span><b id="fxrate">…</b></div>
          <div class="row">${ICON.globe}<span class="k">Network</span><b>Quai Orchard testnet</b></div>
          <div class="row">${ICON.shield}<span class="k">Settlement</span><b>Merchant wallet · no custody</b></div>
          <div class="row">${ICON.wallet}<span class="k">Contract</span><b>${contract || "—"}</b></div>
        </div>
        <button id="pay">${ICON.wallet} Pay with your wallet</button>
        <div class="hint">Opens your Quai wallet. Funds go straight to the merchant in one
          transaction — Rhodium never holds them. You'll get a receipt on WhatsApp.</div>
        <div style="text-align:center">
          <span class="mode ${data.quaiMode === 'live' ? 'live' : 'demo'}">
            ${data.quaiMode === 'live' ? ICON.check + ' Live on Orchard' : ICON.coin + ' Demo (mock) — no on-chain tx yet'}
          </span>
        </div>`;
      const chain = {
        chainId: data.quaiChainId || instruction.chainId,
        rpcUrl: data.quaiRpcUrl,
        explorer: data.quaiExplorer,
      };
      $("pay").onclick = () => pay(data.quaiMode, instruction, chain);
      startFxTicker(instruction);
      // Decide up front rather than letting the buyer tap Pay and hit a wall:
      // on a phone without Blip the button should already say "Open in Blip".
      if (data.quaiMode === "live" && !quaiProvider()) needWallet();
    }

    /**
     * Bank-transfer checkout. The account number IS the payment instrument, so
     * the job here is to make it trivially copyable and to keep polling until
     * the Monnify webhook flips the order — the buyer never sends a screenshot.
     */
    function renderBankTransfer(inst) {
      $("crypto").innerHTML = `${ICON.shield} Bank transfer · settles to the merchant`;
      $("body").innerHTML = `
        <div class="acct">
          <div class="acct-bank">${inst.bankName || "Bank"}</div>
          <div class="acct-no" id="acctno">${inst.accountNumber || "—"}</div>
          <div class="acct-name">${inst.accountName || ""}</div>
          <button id="copy" class="copybtn">${ICON.link} Copy account number</button>
        </div>
        <div class="rows">
          <div class="row">${ICON.globe}<span class="k">Amount</span><b>${data.order.amountFormatted}</b></div>
          <div class="row">${ICON.shield}<span class="k">Settlement</span><b>Merchant's bank · no custody</b></div>
        </div>
        <div class="waiting" id="waiting">
          <span class="spinner"></span> Waiting for your transfer…
        </div>
        <button class="secondary" id="sent">
          I've sent the money — check now
        </button>
        <div class="hint">This account belongs to <b>this order only</b>, so we detect your
          transfer automatically — no screenshot needed. Keep this page open; it updates
          itself, and your receipt arrives on WhatsApp.</div>`;

      $("copy").onclick = async () => {
        try {
          await navigator.clipboard.writeText(inst.accountNumber || "");
          $("copy").innerHTML = `${ICON.check} Copied`;
          setTimeout(() => { $("copy").innerHTML = `${ICON.link} Copy account number`; }, 1800);
        } catch { /* clipboard blocked — the number is on screen anyway */ }
      };
      const sentBtn = $("sent");
      if (sentBtn) {
        sentBtn.onclick = async () => {
          sentBtn.disabled = true;
          const original = sentBtn.textContent;
          sentBtn.textContent = "Checking with the bank…";
          try {
            // Asks the PROVIDER, not the buyer. Pressing this on an unpaid
            // order changes nothing — a claim is not a payment.
            const r = await fetch(`/api/checkout/${orderId}/verify`, { method: "POST" });
            const j = await r.json();
            if (j.status === "paid") { paid(); return; }
            stillWaiting("Not showing yet. Transfers can take a few minutes — we're still watching.");
          } catch {
            stillWaiting("Could not check just now. We're still watching for your transfer.");
          }
          sentBtn.disabled = false;
          sentBtn.textContent = original;
        };
      }
      pollPaid();
    }

    /**
     * A Quai-aware injected wallet, or null.
     *
     * Detection is by CAPABILITY FLAG, not by object name. Blip injects its
     * provider at window.quai and also aliases window.pelagus AND
     * window.ethereum, so checking names alone either misses Blip or picks up a
     * plain MetaMask — which implements no quai_* method and fails with
     * 'The method "quai_requestAccounts" does not exist', an error that reads
     * like our bug rather than "wrong wallet".
     */
    function quaiProvider() {
      const candidates = [window.quai, window.pelagus, window.blip, window.ethereum];
      for (const p of candidates) {
        if (p && (p.isQuai || p.isBlip || p.isPelagus)) return p;
      }
      return null;
    }

    /** Blip's universal link. Opens the app if installed, its site if not. */
    function blipLink() {
      return "https://blippay.me/browser?url=" + encodeURIComponent(location.href);
    }

    function isMobile() {
      return /android|iphone|ipad|ipod/i.test(navigator.userAgent);
    }

    /**
     * No Quai wallet here. On a phone that is one tap from fixable, so offer the
     * jump into Blip rather than instructions the buyer has to act on manually.
     */
    function needWallet() {
      const btn = $("pay");
      btn.disabled = false;
      if (isMobile()) {
        btn.innerHTML = `${ICON.wallet} Open in Blip to pay`;
        btn.onclick = () => { location.href = blipLink(); };
        $("body").insertAdjacentHTML("beforeend",
          '<div class="hint">This order settles on Quai, so it needs the Blip wallet. ' +
          'The button reopens this exact page inside Blip — your order is kept.</div>');
        return;
      }
      btn.innerHTML = `${ICON.wallet} Pay with your wallet`;
      $("body").insertAdjacentHTML("beforeend",
        '<div class="err">This order settles on Quai, so it needs a Quai wallet — ' +
        'MetaMask and other EVM wallets cannot sign it.<br><br>' +
        '<b>On desktop:</b> install <a href="https://pelaguswallet.io" target="_blank" ' +
        'rel="noopener">a Quai wallet</a>, then reload this page.<br>' +
        '<b>On your phone:</b> <a href="' + blipLink() + '">open this order in Blip</a>.' +
        '</div>');
    }

    /**
     * Keep the displayed rate current. The quoted cryptoAmount is fixed at
     * order creation — showing a rate that silently drifts from it would be
     * worse than showing none, so a moved rate is labelled rather than used to
     * re-quote the order.
     */
    function startFxTicker(instruction) {
      const el = () => document.getElementById("fxrate");
      const quotedQuai = Number(instruction.cryptoAmount) / 1e18;
      const naira = instruction.amount / 100;
      const quotedRate = quotedQuai > 0 ? naira / quotedQuai : null;

      async function tick() {
        const node = el();
        if (!node) return;
        try {
          const r = await (await fetch("/api/fx/quai", { cache: "no-store" })).json();
          const rate = Number(r.ngnPerQuai);
          if (!Number.isFinite(rate) || rate <= 0) return;
          let label = `₦${rate.toLocaleString("en-US", { maximumFractionDigits: 2 })} / QUAI`;
          if (r.source === "config") label += " (fallback)";
          else if (r.stale) label += " (may be stale)";
          // Warn only when the live rate has drifted materially from the price
          // this order was quoted at.
          if (quotedRate && Math.abs(rate - quotedRate) / quotedRate > 0.05) {
            label += " · order quoted at ₦" +
              quotedRate.toLocaleString("en-US", { maximumFractionDigits: 2 });
          }
          node.textContent = label;
        } catch { /* leave the last value on screen */ }
      }
      tick();
      setInterval(tick, 60000);
    }

    async function pay(quaiMode, instruction, chain) {
      const btn = $("pay");
      btn.disabled = true; btn.innerHTML = "Confirming…";
      try {
        const provider = quaiProvider();
        if (quaiMode === "live") {
          // Never fall back to the simulator when live: doing so would mark a
          // real order paid with no transaction behind it.
          if (!provider) return needWallet();
          lastTx = await payOnChain(provider, instruction, chain);
        } else {
          const res = await fetch("/api/crypto/simulate-pay", {
            method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ orderId }),
          });
          if (!res.ok) throw new Error((await res.json()).message || "payment failed");
          lastTx = (await res.json().catch(() => ({}))).txHash || null;
        }
        await pollPaid();
      } catch (e) {
        btn.disabled = false; btn.innerHTML = `${ICON.wallet} Pay with your wallet`;
        $("body").insertAdjacentHTML("beforeend", `<div class="err">${e.message}</div>`);
      }
    }

    /**
     * Blip derives a SEPARATE wallet per dApp origin from the same mnemonic, so
     * quai_requestAccounts returns an app wallet whose balance starts at zero —
     * a buyer holding 2000 QUAI in their main vault still fails with
     * "insufficient funds ... have 0". The dApp is expected to ask for a
     * top-up; Blip moves it silently under the per-app limit (1000 QUAI by
     * default) or shows an approval sheet above it.
     */
    async function fundAppWallet(provider, instruction) {
      if (!provider.isBlip) return; // Pelagus has no app-wallet split
      const need = BigInt(instruction.cryptoAmount || "0");
      if (need <= 0n) return;
      const withGas = need + need / 10n; // Blip's docs: request ~10% over
      const params = {
        chainId: "0x" + Number(instruction.chainId || 15000).toString(16),
        reason: "purchase",
        continueLabel: "Continue payment",
        assets: [{
          type: "native", symbol: "QUAI", decimals: 18,
          amountWei: "0x" + withGas.toString(16), purpose: "payment",
        }],
      };
      try {
        await provider.request({ method: "blip_requestAppWalletFunding", params: [params] });
      } catch (e) {
        // Some builds take the object unwrapped. Try once, then give up and let
        // the transaction itself report the real problem.
        try { await provider.request({ method: "blip_requestAppWalletFunding", params }); }
        catch { /* fall through to the send */ }
      }
    }

    /**
     * Put the wallet on the chain this order settles on.
     *
     * Blip defaults to Cyprus1 MAINNET (0x9) while this deployment runs on
     * Orchard testnet (15000 / 0x3a98). On the wrong chain the app wallet is a
     * different address entirely, so the payment fails as "insufficient funds
     * ... have 0" — which looks like an empty wallet rather than a wrong
     * network, and sends the buyer hunting for a faucet that will not help.
     */
    async function ensureChain(provider, want) {
      const target = "0x" + Number(want.chainId || 15000).toString(16);
      let current = null;
      try { current = await provider.request({ method: "quai_chainId" }); } catch { /* older provider */ }
      if (current && String(current).toLowerCase() === target.toLowerCase()) return;

      try {
        await provider.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: target }],
        });
        return;
      } catch (err) {
        // 4902 = wallet does not know this chain yet, so describe it and retry.
        if (err && (err.code === 4902 || /unrecogniz|unsupported|4902/i.test(err.message || ""))) {
          await provider.request({
            method: "wallet_addEthereumChain",
            params: [{
              chainId: target,
              chainName: "Quai Orchard (Cyprus1)",
              rpcUrls: [want.rpcUrl || "https://orchard.rpc.quai.network/cyprus1"],
              nativeCurrency: { name: "Quai", symbol: "QUAI", decimals: 18 },
              blockExplorerUrls: [want.explorer || "https://orchard.quaiscan.io"],
            }],
          });
          return;
        }
        throw new Error(
          "This order settles on Quai Orchard testnet, but your wallet is on a " +
          "different network and would not switch. A desktop wallet extension supports " +
          "this network directly.",
        );
      }
    }

    async function payOnChain(provider, instruction, chain) {
      const accounts = await provider.request({ method: "quai_requestAccounts" });
      await ensureChain(provider, chain);
      // Re-read: switching chains can change the app-wallet address Blip serves.
      const after = await provider.request({ method: "quai_requestAccounts" }).catch(() => accounts);
      const from = (after && after[0]) || accounts[0];
      await fundAppWallet(provider, instruction);
      const { quais } = await import("https://cdn.jsdelivr.net/npm/quais@latest/+esm").catch(() => ({}));
      if (!quais) throw new Error("could not load quais.js — try again in the wallet's browser");
      const orderIdHash = instruction.orderIdBytes32 || quais.id(orderId);
      let dataHex, txParams;
      if (instruction.method === "payNative") {
        const iface = new quais.Interface(["function payNative(bytes32 orderId, address merchant)"]);
        dataHex = iface.encodeFunctionData("payNative", [orderIdHash, instruction.merchantAddress]);
        txParams = { from, to: instruction.contractAddress, data: dataHex, value: "0x" + BigInt(instruction.cryptoAmount).toString(16) };
      } else {
        const iface = new quais.Interface(["function payToken(bytes32 orderId, address merchant, address token, uint256 amount)"]);
        dataHex = iface.encodeFunctionData("payToken", [orderIdHash, instruction.merchantAddress, instruction.tokenAddress, instruction.cryptoAmount]);
        txParams = { from, to: instruction.contractAddress, data: dataHex };
      }
      const txHash = await provider.request({ method: "quai_sendTransaction", params: [txParams] });
      await fetch("/api/crypto/confirm", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ orderId, txHash }),
      });
      return txHash;
    }

    /**
     * Wait for the SERVER to say the order is paid. Never assume it.
     *
     * This loop used to call paid() when it ran out of attempts, so a bank
     * transfer — which takes minutes, not the ~14s the loop allowed — showed
     * "Payment confirmed" to a buyer who had transferred nothing. A vendor
     * could ship goods against a screenshot of that screen.
     *
     * Now it polls indefinitely with a widening interval and only ever reports
     * success on the server's word. A page left open is fine; a false
     * confirmation is not.
     */
    async function pollPaid() {
      let attempt = 0;
      for (;;) {
        try {
          const d = await (await fetch(`/api/checkout/${orderId}`)).json();
          if (d.order.status === "paid") { paid(); return; }
          if (d.order.status === "expired" || d.order.status === "cancelled") {
            stillWaiting(`This order is ${d.order.status}. Ask the seller for a new link.`);
            return;
          }
        } catch { /* transient network — keep waiting */ }
        attempt++;
        // 0.7s while a card-speed confirmation is plausible, then back off to
        // 5s so a page left open overnight is not hammering the server.
        await new Promise((r) => setTimeout(r, attempt < 20 ? 700 : 5000));
        if (attempt === 20) {
          stillWaiting("Still waiting for your transfer. Bank transfers can take a few minutes — keep this page open.");
        }
      }
    }

    /** Honest interim state: waiting is not failure, and it is not success. */
    function stillWaiting(message) {
      const el = $("waiting");
      if (el) el.innerHTML = `<span class="spinner"></span> ${message}`;
    }

    function paid() {
      const explorer = data.quaiExplorer;
      // Only ever show chain links for a CHAIN payment. A bank transfer was
      // offering "View contract", which is meaningless to a buyer
      // who just moved naira and makes the receipt look fraudulent.
      const isCrypto = data.order?.rail === "crypto";
      const txLink = (isCrypto && lastTx && explorer && data.quaiMode === "live")
        ? `<a class="explorer" href="${explorer}/tx/${lastTx}" target="_blank" rel="noopener">${ICON.link} View transaction</a>`
        : (isCrypto && explorer && data.instruction?.contractAddress && data.quaiMode === "live"
            ? `<a class="explorer" href="${explorer}/address/${data.instruction.contractAddress}" target="_blank" rel="noopener">${ICON.link} View contract</a>`
            : "");
      const txHashLine = lastTx ? `<div class="txhash">${lastTx}</div>` : "";
      $("body").innerHTML = `
        <div class="ok">
          <div class="checkwrap">${ICON.check}</div>
          <h2>Payment confirmed</h2>
          <span class="badge">${ICON.shield} settled to merchant · no custody</span>
          <div class="hint" style="margin-top:12px">Receipt sent via WhatsApp. You can close this.</div>
          ${txLink}
          ${txHashLine}
        </div>`;
    }

    load();
  </script>
</body>
</html>
